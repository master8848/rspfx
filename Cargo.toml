[workspace]
members = ["crates/rspfx-sppkg", "crates/rspfx-manifest", "crates/rspfx-rspack-plugin"]
resolver = "2"

[workspace.dependencies]
zip = { version = "2.2", features = ["deflate-zlib-ng"] }
flate2 = "1.0"
quick-xml = "0.36"
walkdir = "2.5"
rayon = "1.10"
memchr = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["fs", "rt-multi-thread", "macros"] }
