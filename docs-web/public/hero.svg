<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="RSPFx hero">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ff6b4a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- bg -->
  <rect width="320" height="320" rx="32" fill="#111827"/>
  <!-- Rspack cube -->
  <g transform="translate(88,72)">
    <path d="M72 18 L124 48 L72 78 L20 48 Z" fill="#ff3b30" opacity="0.95"/>
    <path d="M20 48 L72 78 L72 128 L20 98 Z" fill="#c1271d"/>
    <path d="M72 78 L124 48 L124 98 L72 128 Z" fill="#ff6b4a"/>
    <path d="M72 18 L72 78 L20 48 Z" fill="white" opacity="0.12"/>
  </g>
  <!-- Vite lightning -->
  <g transform="translate(158,118)">
    <path d="M38 2 L12 52 L26 52 L18 88 L62 36 L38 36 L52 2 Z" fill="#facc15" stroke="#a78bfa" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- SPFx S -->
  <g transform="translate(92,188)">
    <rect x="0" y="0" width="136" height="52" rx="10" fill="white" opacity="0.96"/>
    <text x="68" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#0078d4" letter-spacing="-0.03em">RSPFx</text>
  </g>
  <!-- subtle grid -->
  <g opacity="0.06" stroke="white" stroke-width="1">
    <line x1="0" y1="80" x2="320" y2="80"/><line x1="0" y1="160" x2="320" y2="160"/><line x1="0" y1="240" x2="320" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/>
  </g>
</svg>
